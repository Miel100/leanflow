<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LeanFlow — Message received</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --dark:#070910;--surface:#0f1117;--border:#252a3a;
    --accent:#3D5AF1;--accent2:#00C9FF;
    --text:#e6e8ef;--muted:#8b90a3;--titanium:#C0C8D0;--green:#00b874;
  }
  body{
    background:var(--dark);color:var(--text);
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    line-height:1.6;min-height:100vh;display:flex;align-items:center;
    justify-content:center;text-align:center;padding:24px;overflow:hidden;position:relative;
  }
  .bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(61,90,241,0.18) 0%,transparent 65%);z-index:0}
  .card{
    position:relative;z-index:1;max-width:520px;background:var(--surface);
    border:1px solid var(--border);border-radius:20px;padding:56px 44px;
  }
  .check{
    width:76px;height:76px;margin:0 auto 26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:38px;
    background:rgba(0,184,116,0.14);border:1px solid rgba(0,184,116,0.4);color:var(--green);
  }
  h1{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin-bottom:14px;
    background:linear-gradient(135deg,#fff 0%,var(--titanium) 55%,var(--accent2) 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  p{color:var(--muted);font-size:16px;margin-bottom:32px}
  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),#6B7FFF);color:#fff;
    padding:14px 30px;border-radius:12px;font-size:15px;font-weight:700;
    text-decoration:none;transition:all .25s;box-shadow:0 0 40px rgba(61,90,241,0.35)}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 0 64px rgba(61,90,241,0.55)}
  .btn-secondary{
    background:transparent;color:#fff;padding:14px 30px;border-radius:12px;
    font-size:15px;font-weight:600;text-decoration:none;border:1px solid var(--border);transition:all .25s}
  .btn-secondary:hover{border-color:var(--accent);background:rgba(61,90,241,0.15)}
  .brand{margin-top:34px;font-size:14px;font-weight:800;color:#fff;letter-spacing:-0.3px}
  .brand span{color:var(--accent)}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="check">✓</div>
    <h1>Message received</h1>
    <p>Thank you for reaching out. We'll get back to you within one business day.<br>Nothing you shared leaves your control.</p>
    <div class="btns">
      <a class="btn-primary" href="https://leanflow-mrp2-production.up.railway.app" target="_blank" rel="noopener">Try the Live Demo →</a>
      <a class="btn-secondary" href="/leanflow/">Back to site</a>
    </div>
    <div class="brand">Lean<span>Flow</span></div>
  </div>
</body>
</html>
